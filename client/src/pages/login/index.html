<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buddy Hub - Sign In</title>
</head>
<body class="font-body min-h-screen flex items-center justify-center bg-gray-50 px-6">

  <div class="w-full max-w-sm">
    <div class="mb-8">
      <h1 class="font-heading text-2xl font-bold text-gray-900 mb-2">Welcome back</h1>
      <p class="text-gray-600 text-sm">Sign in to continue chatting with your team.</p>
    </div>

    <form id="signin-form" class="space-y-5">
      <div id="email-field"></div>
      <div id="password-field"></div>

      <div class="flex justify-end">
        <a href="#" class="text-primary-600 font-semibold text-sm hover:text-primary-700 transition focus-ring rounded">
          Forgot password?
        </a>
      </div>

      <div id="submit-wrapper"></div>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Don't have an account?
      <a href="/src/pages/signup/index.html" class="text-primary-600 font-semibold hover:text-primary-700 transition focus-ring rounded">Sign Up</a>
    </p>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
