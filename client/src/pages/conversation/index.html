<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buddy Hub - Conversation</title>
  </head>
  <body class="font-body bg-gray-50 h-dvh flex flex-col overflow-hidden">
    <!-- Header -->
    <header
      class="bg-white border-b border-gray-200 flex items-center gap-3 px-4 py-3 flex-shrink-0"
    >
      <a
        href="/src/pages/chats/index.html"
        aria-label="Back to chats"
        class="w-[44px] h-[44px] flex items-center justify-center rounded-full hover:bg-gray-100 transition focus-ring"
      >
        <svg
          class="w-5 h-5 text-gray-900"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 19.5L8.25 12l7.5-7.5"
          />
        </svg>
      </a>
      <div id="header-avatar"></div>
      <div class="flex-1 min-w-0">
        <h1
          id="receiver-name"
          class="font-heading font-semibold text-base text-gray-900 truncate"
        ></h1>
        <p id="is-online" class="text-xs text-success">Online</p>
      </div>
      <button
        id="conversation-options-btn"
        aria-label="Conversation options"
        class="w-[44px] h-[44px] flex items-center justify-center rounded-full hover:bg-gray-100 transition focus-ring"
      >
        <svg
          class="w-5 h-5 text-gray-900"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z"
          />
        </svg>
      </button>
    </header>

    <!-- Message list -->
    <main
      id="message-list"
      class="flex-1 overflow-y-auto px-4 py-4 space-y-3 no-scrollbar"
    ></main>

    <!-- Composer Bar -->
    <footer
      class="bg-white border-t border-gray-200 flex-shrink-0"
      style="height: 64px"
    >
      <div class="flex items-center gap-2 h-full" style="padding: 12px 16px">
        <!-- <button
          aria-label="Add attachment"
          class="w-[44px] h-[44px] flex items-center justify-center rounded-full hover:bg-gray-100 transition focus-ring flex-shrink-0"
        >
          <svg

            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 0119.5 7.372L8.552 18.32m.009-.01l-.01.01"
            />
          </svg>
        </button>

        <button
          aria-label="Open emoji picker"
          class="w-[44px] h-[44px] flex items-center justify-center rounded-full hover:bg-gray-100 transition focus-ring flex-shrink-0"
        >
          <svg
            class="w-5 h-5 text-gray-400"

            stroke="currentColor"
            stroke-width="2"

            />
          </svg>
        </button> -->

        <div class="flex-1">
          <input
            id="message-input"
            type="text"
            placeholder="Type a message..."
            aria-label="Message input"
            class="w-full h-[44px] px-4 bg-gray-100 rounded-full text-sm text-gray-900 placeholder-gray-400 border-2 border-transparent focus:bg-white focus:border-primary-600 focus:outline-none transition"
          />
        </div>

        <button
          id="send-btn"
          aria-label="Send message"
          class="bg-primary-600 hover:bg-primary-700 active:bg-primary-800 transition rounded-full flex items-center justify-center flex-shrink-0 focus-ring"
          style="width: 36px; height: 36px"
        >
          <svg
            class="w-4 h-4 text-white"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z"
              fill="white"
            />
          </svg>
        </button>
      </div>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
