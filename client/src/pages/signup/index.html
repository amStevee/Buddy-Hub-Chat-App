<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buddy Hub - Sign Up</title>
</head>
<body class="font-body min-h-screen flex items-center justify-center bg-gray-50 px-6 py-10">

  <div class="w-full max-w-sm">
    <div class="mb-8">
      <h1 class="font-heading text-2xl font-bold text-gray-900 mb-2">Create your account</h1>
      <p class="text-gray-600 text-sm">Join your team on Buddy Hub in seconds.</p>
    </div>

    <form id="signup-form" class="space-y-5">
      <!-- 2-column name grid -->
      <div class="grid grid-cols-2 gap-4">
        <div id="first-name-field"></div>
        <div id="last-name-field"></div>
      </div>

      <div id="email-field"></div>

      <div id="phone-field"></div>
      <p class="text-xs text-gray-500">Use a Nigerian number like 08012345678 or +2348012345678.</p>

      <div>
        <div id="password-field"></div>
        <div id="strength-meter-wrapper"></div>
      </div>

      <!-- Terms checkbox -->
      <label class="flex items-start gap-3 cursor-pointer select-none">
        <input
          type="checkbox"
          id="terms-checkbox"
          class="mt-0.5 w-5 h-5 rounded-md border-2 border-gray-200 text-primary-600 focus-ring accent-primary-600"
        />
        <span class="text-sm text-gray-600">
          I agree to the <a href="#" class="text-primary-600 font-semibold hover:text-primary-700 transition">Terms of Service</a> and <a href="#" class="text-primary-600 font-semibold hover:text-primary-700 transition">Privacy Policy</a>
        </span>
      </label>

      <div id="submit-wrapper"></div>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Already have an account?
      <a href="/src/pages/login/index.html" class="text-primary-600 font-semibold hover:text-primary-700 transition focus-ring rounded">Sign In</a>
    </p>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
