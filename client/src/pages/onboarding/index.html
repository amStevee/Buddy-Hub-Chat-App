<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buddy Hub - Welcome</title>
</head>
<body class="font-body min-h-screen flex items-center justify-center bg-gray-50 px-6">

  <div class="w-full max-w-sm flex flex-col items-center text-center">

    <!-- Slide illustration area -->
    <div id="slide-illustration" class="w-full h-64 rounded-3xl bg-primary-500/10 flex items-center justify-center mb-8">
      <svg class="w-24 h-24 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-4.255-.949L3 21l1.395-3.72C3.512 16.107 3 14.605 3 13c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
    </div>

    <!-- Slide text -->
    <h1 id="slide-title" class="font-heading text-2xl font-bold text-gray-900 mb-3">Chat freely with your team</h1>
    <p id="slide-desc" class="text-gray-600 text-sm mb-8 max-w-xs">
      Send messages and emojis instantly. Simple, friendly, and fast — just like talking to a friend.
    </p>

    <!-- Progress indicator dots -->
    <div class="flex items-center gap-2 mb-10" role="tablist" aria-label="Onboarding progress">
      <span class="dot-active" data-dot="0" role="tab" aria-selected="true"></span>
      <span class="dot-inactive" data-dot="1" role="tab" aria-selected="false"></span>
      <span class="dot-inactive" data-dot="2" role="tab" aria-selected="false"></span>
    </div>

    <!-- CTA -->
    <div class="w-full" id="cta-wrapper"></div>

    <a href="/src/pages/login/index.html" class="mt-6 text-primary-600 font-semibold text-sm hover:text-primary-700 transition focus-ring rounded">
      Already have an account? Sign In
    </a>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
